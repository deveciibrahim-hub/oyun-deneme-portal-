<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberEscape: Portal Hook</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #050608;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 854px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            overflow: hidden;
            background: #0b0e14;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
        .hud-item {
            background: rgba(13, 15, 23, 0.75);
            border: 1px solid #00f3ff;
            padding: 6px 12px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            font-size: 14px;
            color: #00f3ff;
        }
        #sectorNotice {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
        }
        #controlsHint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div class="hud-item">SKOR: <span id="score">0</span>m</div>
        <div class="hud-item" style="border-color: #ffd700; color: #ffd700;">ÇİP: <span id="chips">0</span></div>
    </div>
    <div id="sectorNotice">SEKTÖR 1: NEON SLUMS</div>
    <div id="controlsHint">Sol Ekran: Kanca | Sağ Ekran: Portal</div>
    <canvas id="canvas"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const chipsEl = document.getElementById('chips');
const sectorEl = document.getElementById('sectorNotice');

// Ekran Boyutu
function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Oyun Durumu
let score = 0;
let chips = 0;
let cameraY = 0;
let gameOver = false;
let currentSector = 1;

// Aşağıdan Yükselen Ölümcül Lazer Duvarı
const laserGrid = {
    y: 0,
    speed: 1.2
};

// Fizik Sabitleri
const gravity = 0.28;
const friction = 0.985;

// Karakter
const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    radius: 10,
    color: '#00f3ff',
    trail: []
};

// Kanca
const hook = {
    active: false,
    x: 0,
    y: 0,
    length: 0
};

// Portallar
let portals = []; // [0] = Turuncu, [1] = Mavi
let portalToggle = 0;

// Harita Öğeleri
let buildings = [];
let dataChips = [];

function init() {
    score = 0;
    cameraY = 0;
    gameOver = false;
    currentSector = 1;
    laserGrid.y = canvas.height + 200;
    laserGrid.speed = 1.2;
    
    player.x = canvas.width / 2;
    player.y = canvas.height - 150;
    player.vx = 0;
    player.vy = 0;
    player.trail = [];
    
    portals = [];
    hook.active = false;
    buildings = [];
    dataChips = [];

    // Başlangıç binaları
    for (let i = 0; i < 10; i++) {
        generateBuilding(canvas.height - i * 160);
    }
    
    showSectorNotice("SEKTÖR 1: NEON SLUMS");
}

function showSectorNotice(text) {
    sectorEl.innerText = text;
    sectorEl.style.opacity = 1;
    setTimeout(() => { sectorEl.style.opacity = 0; }, 2500);
}

function generateBuilding(yPos) {
    const isLeft = Math.random() > 0.5;
    const w = 70 + Math.random() * 70;
    const h = 120 + Math.random() * 80;
    const x = isLeft ? 0 : canvas.width - w;
    buildings.push({ x, y: yPos, w, h });

    // Çip Üretimi
    if (Math.random() < 0.6) {
        dataChips.push({
            x: isLeft ? x + w + 30 : x - 30,
            y: yPos + h / 2,
            radius: 7,
            collected: false
        });
    }
}

// Kontrol Mekanizmaları (Dokunmatik + Fare)
function handleInputStart(clientX, clientY, buttonType) {
    if (gameOver) { init(); return; }

    const rect = canvas.getBoundingClientRect();
    const touchX = clientX - rect.left;
    const touchY = clientY - rect.top + cameraY;

    const isLeftScreen = clientX - rect.left < canvas.width / 2;

    if (buttonType === 0 || isLeftScreen) { // SOL HİS: Kanca
        hook.active = true;
        hook.x = touchX;
        hook.y = touchY;
        const dx = player.x - hook.x;
        const dy = player.y - hook.y;
        hook.length = Math.sqrt(dx * dx + dy * dy);
    } else { // SAĞ HİS: Portal
        const color = portalToggle === 0 ? '#ff9900' : '#00aaff';
        if (portals.length >= 2) portals.shift();
        portals.push({ x: touchX, y: touchY, radius: 24, color });
        portalToggle = 1 - portalToggle;
    }
}

function handleInputEnd(buttonType, isLeftScreen) {
    if (buttonType === 0 || isLeftScreen) {
        hook.active = false;
    }
}

// Event Listeners
canvas.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY, e.button));
canvas.addEventListener('mouseup', e => handleInputEnd(e.button, e.clientX < canvas.width / 2));
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        handleInputStart(t.clientX, t.clientY, -1);
    }
}, { passive: false });

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const isLeft = t.clientX < canvas.width / 2;
        handleInputEnd(-1, isLeft);
    }
}, { passive: false });

// Oyun Mantığı
function update() {
    if (gameOver) return;

    // Yerçekimi ve İvme
    player.vy += gravity;
    player.vx *= friction;
    player.vy *= friction;

    // Karakter İzi (Trail)
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 8) player.trail.shift();

    // Kanca Fiziği
    if (hook.active) {
        const dx = player.x - hook.x;
        const dy = player.y - hook.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > hook.length) {
            const angle = Math.atan2(dy, dx);
            player.x = hook.x + Math.cos(angle) * hook.length;
            player.y = hook.y + Math.sin(angle) * hook.length;
            
            player.vx -= Math.cos(angle) * 0.45;
            player.vy -= Math.sin(angle) * 0.45;
        }
    }

    // Hareket
    player.x += player.vx;
    player.y += player.vy;

    // Portal Işınlanma
    if (portals.length === 2) {
        const p1 = portals[0];
        const p2 = portals[1];
        const d1 = Math.hypot(player.x - p1.x, player.y - p1.y);

        if (d1 < player.radius + p1.radius) {
            player.x = p2.x;
            player.y = p2.y - 20;
            player.vy = -14; // Süper Fırlama
            player.vx *= 1.4;
        }
    }

    // Çip Toplama
    dataChips.forEach(c => {
        if (!c.collected) {
            const dist = Math.hypot(player.x - c.x, player.y - c.y);
            if (dist < player.radius + c.radius) {
                c.collected = true;
                chips += 1;
                chipsEl.innerText = chips;
            }
        }
    });

    // Lazer Duvarının Yükselişi
    laserGrid.y -= laserGrid.speed;

    // Kamera Takibi
    if (player.y < cameraY + canvas.height * 0.5) {
        cameraY = player.y - canvas.height * 0.5;
    }

    // Skor ve Sektör Güncellemesi
    const currentMeters = Math.floor((canvas.height - 150 - player.y) / 10);
    if (currentMeters > score) score = currentMeters;
    scoreEl.innerText = Math.max(0, score);

    if (score > 500 && currentSector === 1) {
        currentSector = 2;
        laserGrid.speed = 1.6;
        showSectorNotice("SEKTÖR 2: CORPORATE TOWERS");
    } else if (score > 1200 && currentSector === 2) {
        currentSector = 3;
        laserGrid.speed = 2.0;
        showSectorNotice("SEKTÖR 3: ORBITAL STRATOSPHERE");
    }

    // Sonsuz Harita Üretimi
    const topBuilding = buildings[buildings.length - 1];
    if (topBuilding.y > cameraY - 200) {
        generateBuilding(topBuilding.y - 150);
    }

    // Ölüm Koşulları (Lazer Duvarına Yakalanma veya Düşme)
    if (player.y > laserGrid.y || player.y > cameraY + canvas.height + 50) {
        gameOver = true;
    }
}

// Çizim Mantığı
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(0, -cameraY);

    // Arka Plan Izgara
    ctx.strokeStyle = currentSector === 3 ? 'rgba(150, 0, 255, 0.08)' : 'rgba(0, 243, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, cameraY); ctx.lineTo(x, cameraY + canvas.height); ctx.stroke();
    }

    // Binalar
    buildings.forEach(b => {
        ctx.fillStyle = '#0f131d';
        ctx.strokeStyle = currentSector === 2 ? '#ff0055' : '#00f3ff';
        ctx.lineWidth = 2;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        // Siber Pencereler
        ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
        for (let wx = b.x + 10; wx < b.x + b.w - 10; wx += 15) {
            for (let wy = b.y + 10; wy < b.y + b.h - 10; wy += 20) {
                ctx.fillRect(wx, wy, 8, 12);
            }
        }
    });

    // Toplanabilir Çipler
    dataChips.forEach(c => {
        if (!c.collected) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    });

    // Portallar
    portals.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Kanca İpi
    if (hook.active) {
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(hook.x, hook.y);
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }

    // Karakter İzi (Trail)
    player.trail.forEach((t, i) => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, player.radius * (i / player.trail.length), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 243, 255, ${i / 10})`;
        ctx.fill();
    });

    // Oyuncu
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.shadowColor = player.color;
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Aşağıdaki Lazer Duvarı (Ölüm Alanı)
    ctx.fillStyle = 'rgba(255, 0, 85, 0.3)';
    ctx.fillRect(0, laserGrid.y, canvas.width, canvas.height * 2);
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(0, laserGrid.y);
    ctx.lineTo(canvas.width, laserGrid.y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore();

    // Game Over Ekranı
    if (gameOver) {
        ctx.fillStyle = 'rgba(5, 6, 8, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SİSTEM ÇÖKTÜ!', canvas.width / 2, canvas.height / 2 - 40);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText(`Ulaşılan Yükseklik: ${score}m`, canvas.width / 2, canvas.height / 2);
        ctx.fillText(`Toplanan Çip: ${chips}`, canvas.width / 2, canvas.height / 2 + 25);

        ctx.fillStyle = '#00f3ff';
        ctx.font = 'bold 14px Arial';
        ctx.fillText('Yeniden Başlamak İçin Dokun', canvas.width / 2, canvas.height / 2 + 75);
    }

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

init();
draw();
</script>
</body>
</html>
