<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Dash: Dark Knight</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0d;
            color: #d4af37;
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 854px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.2);
            overflow: hidden;
            background: #111218;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
        .hud-item {
            background: rgba(17, 18, 24, 0.85);
            border: 1px solid #d4af37;
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            font-size: 15px;
            color: #e6ca65;
            letter-spacing: 1px;
        }
        #comboText {
            position: absolute;
            top: 75px;
            width: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 12px #ff0000;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }
        #controlsHint {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: rgba(212, 175, 55, 0.8);
            background: rgba(10, 10, 13, 0.85);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div class="hud-item">SKOR: <span id="score">0</span></div>
        <div class="hud-item" style="border-color: #ff3333; color: #ff6666;">DALGA: <span id="wave">1</span></div>
    </div>
    <div id="comboText">COMBO x2!</div>
    <div id="controlsHint">Düşmana Doğru Parmağını Kaydır (Swipe)!</div>
    <canvas id="canvas"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const waveEl = document.getElementById('wave');
const comboEl = document.getElementById('comboText');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Oyun Durumu
let score = 0;
let wave = 1;
let combo = 0;
let gameOver = false;

// Karakter (Şövalye)
const player = {
    x: 0,
    y: 0,
    targetX: 0,
    targetY: 0,
    radius: 16,
    color: '#d4af37',
    slashes: [] // Kılıç izleri
};

// Düşmanlar ve Efektler
let enemies = [];
let particles = [];
let spawnTimer = 0;
let spawnInterval = 90; // Frame bazlı üretme hızı

function init() {
    score = 0;
    wave = 1;
    combo = 0;
    gameOver = false;
    spawnInterval = 90;
    
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.targetX = player.x;
    player.targetY = player.y;
    player.slashes = [];
    
    enemies = [];
    particles = [];

    scoreEl.innerText = score;
    waveEl.innerText = wave;
}

// Düşman Üretimi
function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const distance = Math.max(canvas.width, canvas.height) / 2 + 40;
    const x = player.x + Math.cos(angle) * distance;
    const y = player.y + Math.sin(angle) * distance;

    const typeRand = Math.random();
    let type = 'skeleton'; // Hızlı, 1 can
    let hp = 1;
    let speed = 1.2 + wave * 0.15;
    let color = '#e0e0e0';
    let radius = 12;

    if (typeRand > 0.65) { // Şövalye: Yavaş, 2 can
        type = 'knight';
        hp = 2;
        speed = 0.7 + wave * 0.1;
        color = '#8899a6';
        radius = 16;
    }

    enemies.push({ x, y, hp, maxHp: hp, speed, color, radius, type });
}

// Swipe (Kaydırma) Algılama
let touchStartX = 0;
let touchStartY = 0;

function handleSwipe(dx, dy) {
    if (gameOver) { init(); return; }

    const swipeDist = Math.hypot(dx, dy);
    if (swipeDist < 20) return; // Çok küçük hareketleri yok say

    const dirX = dx / swipeDist;
    const dirY = dy / swipeDist;

    // En yakın ve o yöndeki düşmanı bul
    let targetEnemy = null;
    let minDist = Infinity;

    enemies.forEach(e => {
        const toEnemyX = e.x - player.x;
        const toEnemyY = e.y - player.y;
        const dist = Math.hypot(toEnemyX, toEnemyY);

        // Vektör Çarpımı (Açı kontrolü)
        const dot = (toEnemyX / dist) * dirX + (toEnemyY / dist) * dirY;

        if (dot > 0.5 && dist < minDist) { // Yaklaşık olarak doğru yönde
            minDist = dist;
            targetEnemy = e;
        }
    });

    if (targetEnemy) {
        // Düşmana Doğru Işınlan / Atıl
        const startX = player.x;
        const startY = player.y;

        player.x = targetEnemy.x;
        player.y = targetEnemy.y;

        // Kılıç İzi Efekti Ekle
        player.slashes.push({
            x1: startX, y1: startY,
            x2: player.x, y2: player.y,
            alpha: 1.0
        });

        // Düşmana Hasar Ver
        targetEnemy.hp -= 1;

        // Efekt Parçacıkları (Kan/Kıvılcım)
        for (let i = 0; i < 8; i++) {
            particles.push({
                x: targetEnemy.x,
                y: targetEnemy.y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                color: targetEnemy.hp > 0 ? '#d4af37' : '#ff3333',
                life: 1.0
            });
        }

        if (targetEnemy.hp <= 0) {
            enemies = enemies.filter(e => e !== targetEnemy);
            score += 10;
            combo += 1;
            showCombo();
        } else {
            // Şövalyenin zırhı kırıldı, geriye fırlat
            targetEnemy.x += dirX * 30;
            targetEnemy.y += dirY * 30;
        }

        scoreEl.innerText = score;

        // Dalga İlerlemesi
        if (score % 100 === 0 && score > 0) {
            wave += 1;
            waveEl.innerText = wave;
            if (spawnInterval > 30) spawnInterval -= 10;
        }
    } else {
        // Boşa Sallama - Combo Sıfırla
        combo = 0;
    }
}

function showCombo() {
    if (combo > 1) {
        comboEl.innerText = `COMBO x${combo}!`;
        comboEl.style.opacity = 1;
        comboEl.style.transform = 'scale(1.2)';
        setTimeout(() => {
            comboEl.style.opacity = 0;
            comboEl.style.transform = 'scale(1.0)';
        }, 500);
    }
}

// Dokunmatik ve Fare Etkinlikleri
canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchend', e => {
    const touchEndX = e.changedTouches[0].clientX;
    const touchEndY = e.changedTouches[0].clientY;
    handleSwipe(touchEndX - touchStartX, touchEndY - touchStartY);
}, { passive: true });

let isMouseDown = false;
canvas.addEventListener('mousedown', e => {
    touchStartX = e.clientX;
    touchStartY = e.clientY;
    isMouseDown = true;
});

canvas.addEventListener('mouseup', e => {
    if (isMouseDown) {
        handleSwipe(e.clientX - touchStartX, e.clientY - touchStartY);
        isMouseDown = false;
    }
});

// Oyun Güncelleme
function update() {
    if (gameOver) return;

    // Düşman Üretimi
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnEnemy();
        spawnTimer = 0;
    }

    // Düşman Hareketi (Player'a Doğru)
    enemies.forEach(e => {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.hypot(dx, dy);

        e.x += (dx / dist) * e.speed;
        e.y += (dy / dist) * e.speed;

        // Çarpışma / Ölüm Kontrolü
        if (dist < player.radius + e.radius - 4) {
            gameOver = true;
        }
    });

    // Parçacık Fiziği
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
    });
    particles = particles.filter(p => p.life > 0);

    // Kılıç İzi Saydamlığı
    player.slashes.forEach(s => s.alpha -= 0.08);
    player.slashes = player.slashes.filter(s => s.alpha > 0);
}

// Çizim Mantığı
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Zindan Taş Zemini
    ctx.strokeStyle = '#181a24';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.strokeRect(x, y, 40, 40);
        }
    }

    // Kılıç Atılım İzi (Slash Lines)
    player.slashes.forEach(s => {
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.strokeStyle = `rgba(212, 175, 55, ${s.alpha})`;
        ctx.lineWidth = 4;
        ctx.shadowColor = '#d4af37';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;
    });

    // Parçacıklar
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Düşmanlar
    enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = e.type === 'knight' ? 12 : 6;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Zırh Göstergesi (Canı 2 olanlar için dış halka)
        if (e.hp > 1) {
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    });

    // Oyuncu (Karanlık Şövalye)
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.shadowColor = player.color;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Game Over Ekranı
    if (gameOver) {
        ctx.fillStyle = 'rgba(10, 10, 13, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 28px Georgia';
        ctx.textAlign = 'center';
        ctx.fillText('ÖLDÜNÜZ!', canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#d4af37';
        ctx.font = '16px Georgia';
        ctx.fillText(`Toplam Skor: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText(`Ulaşılan Dalga: ${wave}`, canvas.width / 2, canvas.height / 2 + 35);

        ctx.fillStyle = '#fff';
        ctx.font = '13px Georgia';
        ctx.fillText('Yeniden Doğmak İçin Ekrana Dokun', canvas.width / 2, canvas.height / 2 + 85);
    }

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

init();
draw();
</script>
</body>
</html>
